<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ITPEC FE Subject A Reviewer</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--tx:#1f2328;--mut:#6b7280;--bd:#dcdad2;--ac:#2f5fd0;--ok:#e3f4e6;--okb:#2e8b45;--no:#fbe4e4;--nob:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--card:#20242a;--tx:#e8eaed;--mut:#9aa3ad;--bd:#343a42;--ac:#7ea2ff;--ok:#1d3a26;--okb:#4cc26a;--no:#40201f;--nob:#ff7b6e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,sans-serif}
.w{max-width:820px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.4rem;margin:0 0 4px}.sub{color:var(--mut);font-size:.9rem;margin-bottom:16px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.tab,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}.btn{margin-left:auto}
.score{color:var(--mut);font-size:.9rem;margin-bottom:12px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.qt{font-weight:600;margin:0 0 12px}.qn{color:var(--ac)}
.o{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:transparent;color:var(--tx);padding:10px 12px;margin:6px 0;border-radius:8px;cursor:pointer;font:inherit}
.o:hover:not(:disabled){border-color:var(--ac)}.o:disabled{cursor:default}
.o.ok{background:var(--ok);border-color:var(--okb)}.o.no{background:var(--no);border-color:var(--nob)}
.ex{margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px;font-size:.93rem}
.ex p{margin:6px 0}.g{color:var(--okb);font-weight:600}.r{color:var(--nob);font-weight:600}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.nb{min-width:40px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);cursor:pointer;font:inherit;font-size:.85rem}.nb.ok{background:var(--ok);border-color:var(--okb)}.nb.no{background:var(--no);border-color:var(--nob)}#fl{position:fixed;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
</style></head><body><div class="w">
<h1>ITPEC Fundamental IT Engineer – Subject A</h1>
<div class="sub">Click an answer to see the correct one with a full explanation.</div>
<div class="bar" id="tabs"></div>
<div class="score" id="score"></div>
<div class="nav" id="nav"></div>
<div id="list"></div>
<div id="fl"><button class="tab" onclick="scrollTo({top:0,behavior:'smooth'})">↑ Top</button><button class="tab" onclick="document.querySelector('#list').lastElementChild.previousElementSibling.scrollIntoView({behavior:'smooth'})">↓ Bottom</button></div>
</div>
<script src="questions-2025S.js"></script>
<script src="questions-2025A.js"></script>
<script src="questions-2026S.js"></script>
<script>
const D={
"2025S_FE-A_Questions.pdf":[
{n:1,t:"For an 8-bit binary integer, which operation extracts the most significant 4 bits while making the other bits zero?",o:["Bitwise AND with 11110000","Bitwise NAND with 11110000","Bitwise OR with 00001111","Bitwise XOR with 00001111"],a:0,e:["AND with 1 keeps a bit; AND with 0 clears it. The mask 11110000 keeps the upper four bits and zeroes the lower four. Example: 10110101 AND 11110000 = 10110000.","NAND is the inverse of AND, so the kept bits come out flipped and the cleared bits become 1. The upper four bits would be inverted and the lower four set to 1.","OR with 00001111 forces the lower four bits to 1 and leaves the upper four unchanged. The lower bits are not zero, so this fails.","XOR with 00001111 flips the lower four bits and leaves the upper four as they are. The lower bits are not zero, so this fails."]},
{n:8,t:"A CPU with an 800 MHz clock executes one instruction in an average of 4 clock cycles. What is its performance in MIPS?",o:["0.2","20","200","3,200"],a:2,e:["Wrong: 0.2 is off by a factor of 1,000.","Wrong: 20 is off by a factor of 10.","Correct: 800 MHz = 800 million cycles/s. Dividing by 4 cycles per instruction gives 200 million instructions/s = 200 MIPS.","Wrong: 3,200 comes from multiplying 800 by 4 instead of dividing. More cycles per instruction lowers performance, not raises it."]},
{n:12,t:"Two processing devices each have availability 0.9. What is the difference in availability between (1) the system works if at least one device runs and (2) it works only if both run?",o:["0.09","0.10","0.18","0.19"],a:2,e:["Wrong: 0.09 is just 0.9 × 0.1, a partial term and not the difference.","Wrong: 0.10 is the failure probability of one device, not a difference between the two conditions.","Correct: Condition (1), parallel: 1 − (0.1 × 0.1) = 0.99. Condition (2), series: 0.9 × 0.9 = 0.81. Difference = 0.99 − 0.81 = 0.18.","Wrong: 0.19 would be 1 − 0.81, the probability that at least one fails. That is not the difference of the two availabilities."]},
{n:23,t:"Which is the most appropriate information for a router to determine the destination of an incoming packet?",o:["Destination IP address","Destination MAC address","Source IP address","Source MAC address"],a:0,e:["Correct: Routers work at the network layer. They look up the destination IP address in the routing table to pick the next hop.","Wrong: MAC addresses are data-link information that is rewritten at every hop. Switches and bridges use them, not routers, to decide where to forward.","Wrong: The source IP identifies the sender, which matters for replies, filtering and logging, but not for deciding where the packet goes.","Wrong: The source MAC is only the previous hop on this link and has no bearing on the route."]},
{n:25,t:"Which is an appropriate explanation of Address Resolution Protocol (ARP)?",o:["It converts MAC addresses into IP addresses","It resolves domain names into IP addresses","It resolves IP addresses into the corresponding MAC addresses","It translates IPv4 addresses into IPv6 addresses"],a:2,e:["Wrong: This is the reverse direction (RARP). ARP goes from IP to MAC.","Wrong: Resolving domain names to IPs is the job of DNS.","Correct: ARP broadcasts a request such as “who has 192.168.1.10?” and the owner replies with its MAC address, which the sender needs to build the Ethernet frame.","Wrong: Translating between IPv4 and IPv6 is done by mechanisms such as NAT64 or tunneling, not ARP."]},
{n:60,t:"Company A bought a machine for $126,000 with a salvage value of $6,000 after 6 years. What is the annual depreciation expense using the straight-line method?",o:["12,000","20,000","21,000","36,000"],a:1,e:["Wrong: 12,000 does not match any correct step of the formula.","Correct: Straight-line = (cost − salvage) / life = (126,000 − 6,000) / 6 = 20,000 per year.","Wrong: 21,000 is 126,000 / 6, which forgets to subtract the salvage value.","Wrong: 36,000 would be 6,000 × 6, which is meaningless here."]}
],
"2025A_FE-A_Questions.pdf":[
{n:2,t:"Let n be a two’s complement binary integer. Which operation yields 9 × n using only bit shifting and one addition or subtraction?",o:["Shift n left 2 bits, then add n","Shift n left 2 bits, then subtract n","Shift n left 3 bits, then add n","Shift n left 3 bits, then subtract n"],a:2,e:["Wrong: Left shift by 2 multiplies by 4, so 4n + n = 5n.","Wrong: 4n − n = 3n.","Correct: Left shift by 3 multiplies by 8, so 8n + n = 9n. This works for two’s complement as well.","Wrong: 8n − n = 7n."]},
{n:13,t:"Five processes A–E arrive together in that order with running times 10, 6, 2, 8 and 4 ms. What is the average turnaround time under FCFS?",o:["14","19.2","20","22"],a:2,e:["Wrong: 14 is not what FCFS produces for this order.","Wrong: 19.2 would come from a shortest-job-first style ordering, not arrival order.","Correct: Completion times in arrival order are 10, 16, 18, 26, 30. Sum = 100, and 100 / 5 = 20 ms.","Wrong: 22 is not the average of these completion times."]},
{n:15,t:"Main memory holds three pages, and pages are referenced in the order 1, 2, 3, 2, 1, 4, 5. With LRU, which page is replaced at the last reference (5)?",o:["1","2","3","4"],a:1,e:["Wrong: Page 1 was used just before page 4, so it is more recent than 2.","Correct: After 1, 2, 3, 2, 1 memory holds {1, 2, 3}. Reference 4 evicts 3 (least recently used), giving {1, 2, 4}. Reference 5 then evicts the least recently used of those: 2 was last used before 1 and 4, so 2 is replaced.","Wrong: Page 3 was already evicted when 4 was loaded, so it is not in memory at reference 5.","Wrong: Page 4 was just loaded and is the most recently used."]},
{n:22,t:"In transaction management, which condition does the Isolation property ensure?",o:["Data is written permanently after a transaction","Only valid data is written to the database","Transactions are either fully completed or revoked","Transactions are executed without affecting each other"],a:3,e:["Wrong: Permanence of committed data is Durability.","Wrong: Moving the database from one valid state to another is Consistency.","Wrong: All-or-nothing execution is Atomicity.","Correct: Isolation means concurrent transactions do not interfere. Each behaves as if it ran alone, usually enforced with locking."]},
{n:42,t:"A project costs $70,000 normally, $50,000 in the best case and $120,000 in the worst case. What is the PERT three-point expected cost?",o:["70,000","75,000","80,000","85,000"],a:1,e:["Wrong: 70,000 is only the most likely value and ignores the other two estimates.","Correct: PERT = (optimistic + 4 × most likely + pessimistic) / 6 = (50,000 + 280,000 + 120,000) / 6 = 450,000 / 6 = 75,000.","Wrong: 80,000 does not follow from the formula. It is not the simple average either, which is about 80,000 only by coincidence of equal weights.","Wrong: 85,000 is the midpoint of best and worst case, which ignores the weight on the most likely value."]},
{n:43,t:"An SLA covers 7 AM–11 PM on 30 business days a month with availability of 99% or more. What is the maximum downtime in hours?",o:["1.2","3.0","4.8","7.2"],a:2,e:["Wrong: 1.2 is too small.","Wrong: 3.0 does not match the service hours.","Correct: Service time = 16 h × 30 days = 480 h. Allowed downtime = 1% × 480 = 4.8 h.","Wrong: 7.2 would be 1.5% of 480 h, or wrongly uses 24 h days."]}
],
"2026S_FE-A_Questions.pdf":[
{n:2,t:"What is the decimal equivalent of the octal number 1234.2?",o:["27.0","668.25","1542.5","5346.0"],a:1,e:["Wrong: 27.0 is not a valid expansion of these digits.","Correct: 1×8³ + 2×8² + 3×8 + 4 = 512 + 128 + 24 + 4 = 668. The fraction .2 octal = 2/8 = 0.25. Total 668.25.","Wrong: 1542.5 comes from reading the digits with the wrong base, such as decimal 1234 converted incorrectly.","Wrong: 5346.0 ignores the fractional part and uses incorrect weights."]},
{n:7,t:"F(x, y) = F(y, x mod y) when y > 0, and F(x, y) = x when y = 0. What is F(231, 15)?",o:["2","3","5","7"],a:1,e:["Wrong: 2 is not reached by the recursion.","Correct: F(231,15): 231 mod 15 = 6, so F(15,6). 15 mod 6 = 3, so F(6,3). 6 mod 3 = 0, so F(3,0) = 3. This is Euclid’s algorithm, so the result is gcd(231, 15) = 3.","Wrong: 5 divides 15 but not 231, so it cannot be the gcd.","Wrong: 7 divides 231 but not 15, so it cannot be the gcd."]},
{n:14,t:"What is the CPU utilization (rounded, %) when three jobs, each with 30% average I/O wait, run on a single CPU?",o:["10","34","90","97"],a:3,e:["Wrong: 10 is not derived from the formula.","Wrong: 34 is roughly 0.3³ expressed oddly. The right quantity is the complement.","Wrong: 90 is 1 − 0.1, which misuses the wait fraction.","Correct: The CPU is idle only when all three jobs wait at once: 0.3³ = 0.027. Utilization = 1 − 0.027 = 0.973 ≈ 97%."]},
{n:15,t:"P1, P2, P3, P4 need 5, 13, 4 and 8 ms and all arrive at time 0. With Round Robin and a 5 ms time slice, what is the average waiting time?",o:["7.5","10","11.5","19"],a:2,e:["Wrong: 7.5 is too low for this schedule.","Wrong: 10 does not match the totals.","Correct: Schedule: P1 0–5 (done), P2 5–10, P3 10–14 (done), P4 14–19, P2 19–24, P4 24–27 (done), P2 27–30 (done). Waiting = finish − burst: P1 0, P2 30−13 = 17, P3 14−4 = 10, P4 27−8 = 19. Sum 46 / 4 = 11.5 ms.","Wrong: 19 is only P4’s waiting time, not the average."]},
{n:42,t:"A system is 500 FP at 10 FP per person-month. Installation and education take 10 person-months, and project management adds 10% of development + installation + education. How many person-months in total?",o:["51","60","65","66"],a:3,e:["Wrong: 51 adds only 10% of development and misses the rest.","Wrong: 60 is development + installation/education with no management effort.","Wrong: 65 applies 10% to only part of the base, or rounds wrongly.","Correct: Development = 500 / 10 = 50. Plus 10 = 60. Management = 10% × 60 = 6. Total = 66 person-months."]},
{n:59,t:"To earn a $42,000 profit, how many units must be sold? Price $17, fixed costs $130,000 + $10,000, variable cost $3 + $4 per unit.",o:["14,000","18,200","26,000","26,200"],a:1,e:["Wrong: 14,000 divides only the fixed costs by the unit contribution and ignores the target profit.","Correct: Fixed costs = 140,000. Variable cost per unit = 7, so contribution = 17 − 7 = 10. Units = (140,000 + 42,000) / 10 = 18,200.","Wrong: 26,000 uses the wrong contribution margin, such as 7.","Wrong: 26,200 mixes up the margin as well as the target."]}
]};
for(const k in window.EXTRA||{})D[k]=D[k].concat(EXTRA[k]);for(const k in D)D[k].sort((a,b)=>a.n-b.n);
let cur=Object.keys(D)[0],done={},showEx=true,open={};
const $=s=>document.querySelector(s),L="abcd";
function tabs(){$("#tabs").innerHTML="";Object.keys(D).forEach(k=>{const b=document.createElement("button");b.className="tab"+(k==cur?" on":"");b.textContent=k;b.onclick=()=>{cur=k;tabs();draw()};$("#tabs").append(b)});const s=document.createElement("button");s.className="btn";s.textContent="Shuffle questions";s.onclick=()=>{const a=D[cur];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}Object.keys(done).forEach(x=>{if(x.startsWith(cur))delete done[x]});draw()};$("#tabs").append(s);const h=document.createElement("button");h.className="tab";h.textContent=showEx?"Hide explanations":"Show explanations";h.onclick=()=>{showEx=!showEx;tabs();draw()};$("#tabs").append(h)}
function draw(){const qs=D[cur],list=$("#list");list.innerHTML="";let c=0,t=0;
qs.forEach((q,i)=>{const d=document.createElement("div");d.className="q";d.id="q"+q.n;d.innerHTML=`<p class="qt"><span class="qn">Q${q.n}.</span> ${q.t}</p>`;
q.o.forEach((o,k)=>{const b=document.createElement("button");b.className="o";b.textContent=L[k]+") "+o;b.onclick=()=>pick(q,d,k);d.append(b)});list.append(d);
const key=cur+q.n;if(done[key]!==undefined)pick(q,d,done[key],true)});
const fb=document.createElement("button");fb.className="tab on";fb.textContent="Finish and see summary";fb.onclick=summary;list.append(fb);const sm=document.createElement("div");sm.id="sum";sm.style.marginTop="16px";list.append(sm);upd()}
function nav(qs){$("#nav").innerHTML="";qs.forEach(q=>{const v=done[cur+q.n],b=document.createElement("button");b.className="nb"+(v===undefined?"":v==q.a?" ok":" no");b.textContent=q.n;b.title="Go to Q"+q.n;b.onclick=()=>$("#q"+q.n).scrollIntoView({behavior:"smooth",block:"start"});$("#nav").append(b)})}
function upd(){const qs=D[cur];nav(qs);let t=0,c=0;qs.forEach(q=>{const v=done[cur+q.n];if(v!==undefined){t++;if(v==q.a)c++}});$("#score").textContent=`${cur}: ${qs.length} of 60 questions loaded · answered ${t} · correct ${c}`}
function pick(q,d,k,re){done[cur+q.n]=k;const bs=d.querySelectorAll(".o");
bs.forEach((b,i)=>{b.disabled=true;if(i==q.a)b.classList.add("ok");else if(i==k)b.classList.add("no")});
d.querySelector(".ex")?.remove();const ex=document.createElement("div");ex.className="ex";
ex.innerHTML=`<p><b>${k==q.a?"Correct!":"Not quite."} The answer is ${L[q.a]}).</b></p>`+q.e.map((e,i)=>`<p><span class="${i==q.a?"g":"r"}">${L[i]}) ${i==q.a?"Right":"Wrong"}.</span> ${e.replace(/^(Correct|Wrong): /,"")}</p>`).join("");
const key=cur+q.n,tb=document.createElement("button");tb.className="tab";tb.style.marginTop="8px";tb.textContent="Show explanation";tb.onclick=()=>{ex.style.display="block";tb.remove();open[key]=1};if(!showEx&&!open[key]){ex.style.display="none";d.append(tb)}d.append(ex);if(!re)upd()}
function summary(){let T=0,C=0,A=0,h="<div class='q'><p class='qt'>Score summary</p>";for(const k in D){let a=0,c=0,m=[];D[k].forEach(q=>{const v=done[k+q.n];if(v!==undefined){a++;if(v==q.a)c++;else m.push("Q"+q.n)}});T+=D[k].length;C+=c;A+=a;h+=`<p><b>${k}</b><br>${c} correct of ${a} answered (${D[k].length} questions loaded)`+(m.length?`<br>Missed: ${m.join(", ")}`:"")+"</p>"}
h+=`<p><b>Total: ${C} / ${A} answered</b>`+(A?` (${Math.round(100*C/A)}%)`:"")+`. Not yet answered: ${T-A}</p></div>`;$("#sum").innerHTML=h;$("#sum").scrollIntoView({behavior:"smooth"})}
tabs();draw();
</script></body></html>
